# Wind turbine event questions. Jev sees only `status` and `message`, never the code or
# the operator's own category labels. Each question asks one literal thing about the
# message text; code combines the answers (see triage.py). All five are sent to Jev in
# one request per distinct (status, message) pair.
# Keys "true" and "false" are quoted so YAML keeps them as strings.

names_safety_hazard:
  type: noul
  instructions: Does `message` name an emergency stop, a safety chain, overspeed, excessive rotor speed, tower oscillation or vibration, fire or smoke?
  criteria:
    "true": The message names one of these, for example "Emergency stop nacelle" or "Safety chain open".
    "false": The message names none of these. A brake, a temperature or a pressure alone does not count.

names_physical_damage:
  type: noul
  instructions: Does `message` say that a part is worn, broken, leaking or defective?
  criteria:
    "true": The message uses a word such as worn, broken, leaking, defect or defective about a part.
    "false": The message reports an error, a fault, a timeout, an overload, a trip or a limit being reached, which may be reset without replacing anything, or names no part at all.

names_routine:
  type: noul
  instructions: Does `message` describe a test, maintenance, a manual or remote stop by people, a stop requested by the owner or park controller, or a routine procedure such as cable unwinding or oil flushing?
  criteria:
    "true": The message describes an activity someone chose to do or a scheduled procedure.
    "false": The message describes something that happened to the turbine, such as an error, a fault, a limit or a weather or grid condition.

names_outside_condition:
  type: noul
  instructions: Does `message` name the power grid, grid frequency, grid voltage, a grid loss, or the wind being too weak, too strong or from the wrong direction?
  criteria:
    "true": The message names the grid or the wind as the condition.
    "false": The message names a part of the turbine. A converter, including a "frequency converter", is part of the turbine, not the grid.

names_turbine_problem:
  type: noul
  instructions: Does `message` name an error, fault, failure, defect, timeout, overload or trip, or a reading that is too high, too low, at its limit, deviating or implausible, in a part or system of the turbine itself?
  criteria:
    "true": The message names a problem or an abnormal reading in something inside the turbine, such as the converter, brake, gearbox, generator, pitch, yaw, hydraulics, a bearing temperature, a sensor or the controller.
    "false": The message only reports a status, a stage or a procedure, or names the grid or wind.
