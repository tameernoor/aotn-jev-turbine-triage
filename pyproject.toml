[project]
name = "jev-turbine-triage"
version = "0.1.0"
description = "Jev triages wind turbine events, code decides. Companion code for an article."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_turbine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
